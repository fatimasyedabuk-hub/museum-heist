<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>The Museum Heist – An Interactive Mystery</title>
<meta name="description" content="An interactive mystery. Six scenes. One stolen painting.">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/styles.css">
</head>
<body>
<header class="topbar" id="topbar" hidden>
  <button class="brand" data-go="1" aria-label="Back to the museum exterior">The Museum Heist</button>
  <nav id="nav" aria-label="Scenes"></nav>
  <div class="tracker" id="tracker" aria-live="polite"></div>
</header>
<main id="stage"></main>
<div class="toast" id="toast" role="status" aria-live="polite"></div>
<div class="modal" id="modal" hidden role="dialog" aria-modal="true" aria-labelledby="modal-title">
  <div class="modal-card" id="modal-card"></div>
</div>
<script src="js/app.js"></script>
</body>
</html>
